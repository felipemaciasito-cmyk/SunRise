name: iOS build

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build for iOS device
        run: |
          xcodebuild \
            -project SunRise.xcodeproj \
            -scheme SunRise \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package device build
        run: |
          mkdir -p SunRise-device-build
          cp -R build/Build/Products/Release-iphoneos/SunRise.app SunRise-device-build/
          cd SunRise-device-build
          zip -r "$GITHUB_WORKSPACE/SunRise-device.zip" SunRise.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunRise-device-build
          path: SunRise-device.zip
          retention-days: 14
