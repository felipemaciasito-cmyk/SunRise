name: iOS build
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build for iOS Simulator
        run: xcodebuild -project SunRise.xcodeproj -scheme SunRise -sdk iphonesimulator -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: cd build/Build/Products/Release-iphonesimulator && zip -r "$GITHUB_WORKSPACE/SunRise-simulator.zip" SunRise.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunRise-simulator-build
          path: SunRise-simulator.zip
          retention-days: 14
